            { category: "QoS_Troubleshoot", q: "137. Melyik protokoll egy gyártófüggetlen 2. rétegű protokoll, amely a gazdagép azonosítóját és képességeit hirdeti a többi csatlakoztatott hálózati eszköz felé?", options: ["NTP", "LLDP", "SNMP", "MPLS"], correct: [1] },
            { category: "QoS_Troubleshoot", q: "148. Milyen típusú forgalmat lehet előre jelezhetőnek és zökkenőmentesnek nevezni?", options: ["videó", "adat", "hang"], correct: [2] },
            { category: "QoS_Troubleshoot", q: "149. Melyik sorkezelő mechanizmus nem rendelkezik prioritáskezeléssel vagy puffereléssel, hanem egyszerűen az érkezés sorrendjében továbbítja a csomagokat?", options: ["FIFO", "LLQ", "CBWFQ", "WFQ"], correct: [0] },
            { category: "QoS_Troubleshoot", q: "157. Milyen típusú forgalomra vonatkozik az a követelmény, hogy a késleltetés nem haladhatja meg a 400 milliszekundumot (ms)?", options: ["videó", "adat", "hang"], correct: [0] },
            { category: "QoS_Troubleshoot", q: "161. Melyik protokoll használ kisebb rétegszámokat annak jelzésére, hogy a szerver közelebb van a hitelesített időforráshoz, mint a nagyobb rétegszámok?", options: ["TFTP", "SYSLOG", "NTP", "MPLS"], correct: [2] },
            { category: "QoS_Troubleshoot", q: "164. Tekintse meg a mellékletet. Egy webtervező felhívja a technikust, hogy a webs1.cisco.com webszerver nem érhető el webböngészőn keresztül. A technikus parancssori segédprogramokat használ. Melyik két dolog állapítható meg a problémával kapcsolatban? (Válasszon kettőt.)", options: ["A 192.168.0.10 címen található webszerver elérhető a forrásgépről.", "A DNS nem tudja feloldani a web-s1.cisco.com szerver IP-címét.", "A forrásgép és a web-s1.cisco.com szerver között egy útválasztó nem működik.", "Probléma van a web-s1.cisco.com webszerver szoftverével.", "A forrásgép és a 192.168.0.10 című szerver közötti alapértelmezett átjáró nem működik."], correct: [0, 1], image: "164.jpg" },
            { category: "QoS_Troubleshoot", q: "165. Milyen típusú forgalmat jellemeznek úgy, hogy általában kiszámíthatatlan, inkonzisztens és szakaszos?", options: ["videó", "hang", "adat"], correct: [2] },
            { category: "QoS_Troubleshoot", q: "166. Illessze a funkciókat a megfelelő rétegekhez! (Nem minden lehetőséget használnak.)", options: ["Hozzáférési réteg → hálózati hozzáférést biztosít a felhasználó számára", "Elosztó réteg → hozzáférési szabályokat érvényesít, meghatározza a 3. rétegű útválasztási határokat", "Mag réteg → nagy sebességű gerinchálózati kapcsolatot biztosít, összesítőként működik"], correct: [0, 1, 2], multiMatch: true },
            { category: "QoS_Troubleshoot", q: "167. Milyen típusú forgalomról van szó, amelyet úgy írnak le, hogy interaktív esetben magasabb prioritást igényel?", options: ["hang", "adat", "videó"], correct: [0] },
            { category: "QoS_Troubleshoot", q: "184. Milyen típusú forgalomról van szó, amely a hiba-helyreállítás szükségességétől függően vagy TCP-t, vagy UDP-t használ?", options: ["videó", "hang", "adat"], correct: [2] },
            { category: "QoS_Troubleshoot", q: "189. Milyen típusú forgalmat jelöl az a kifejezés, amely alacsonyabb prioritást kap, ha nem feladatkritikus?", options: ["videó", "adat", "hang"], correct: [1] },
            { category: "QoS_Troubleshoot", q: "192. Melyik protokoll teszi lehetővé a rendszergazda számára, hogy lekérdezéseket indítson az ügynökök felé az ügynöki MIB-ből származó információk eléréséhez?", options: ["CBWFQ", "SYSLOG", "TFTP", "SNMP"], correct: [3] },
            { category: "QoS_Troubleshoot", q: "194. Milyen típusú adatforgalomról mondják, hogy képes elviselni egy bizonyos mértékű késleltetést, ingadozást és adatvesztést anélkül, hogy ez észrevehető hatással járna?", options: ["hang", "videó", "adat"], correct: [2] },
            { category: "QoS_Troubleshoot", q: "195. Melyik kifejezés írja le azt a folyamatot, amikor a csomag fejlécéhez – a forráshoz a lehető legközelebb – egy értéket adnak hozzá, hogy a csomag megfeleljen egy meghatározott szabálynak?", options: ["ellenőrzés", "forgalomjelölés", "súlyozott véletlenszerű korai észlelés (WRED)", "forgalomformálás", "tail drop"], correct: [1] },
            { category: "QoS_Troubleshoot", q: "198. Melyik protokoll egy gyártófüggetlen 2. rétegű felderítési protokoll, amelyet az információs csomagok küldéséhez és fogadásához külön kell konfigurálni?", options: ["SNMP", "MPLS", "LLDP", "NTP"], correct: [2] },
            { category: "QoS_Troubleshoot", q: "201. Egy technikus egy 2. rétegű kapcsolón dolgozik, és észreveszi, hogy a G0/5 porton folyamatosan megjelenik egy %CDP-4-DUPLEX_MISMATCH üzenet. Melyik parancsot kell a technikusnak kiadnia a kapcsolón a hibaelhárítási folyamat elindításához?", options: ["show cdp neighbors", "show ip interface brief", "show interface g0/5", "show cdp"], correct: [2] },
            { category: "QoS_Troubleshoot", q: "207. Milyen típusú adatforgalomra vonatkozik az a követelmény, hogy legalább 384 Kbps sávszélességre van szükség?", options: ["hang", "adat", "videó"], correct: [2] },
            { category: "QoS_Troubleshoot", q: "210. Melyik QoS-technika egyenletessé teszi a csomagok kimeneti sebességét?", options: ["policing", "alakítás (shaping)", "súlyozott véletlenszerű korai észlelés", "Integrált szolgáltatások (IntServ)", "jelölés"], correct: [1] }
        ];

        // ============================================================
        // KVIZ LOGIKA - TÖBBVÁLASZTÓS KEZELÉSSEL
        // ============================================================
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let evaluated = false;
        let selectedOptions = [];
        let correctCount = 0;
        let wrongCount = 0;

        const categorySelect = document.getElementById('category');
        const questionEl = document.getElementById('question-text');
        const catBadgeEl = document.getElementById('cat-badge');
        const imageContainer = document.getElementById('image-container');
        const optionsEl = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');
        const currentQEl = document.getElementById('current-q');
        const totalQEl = document.getElementById('total-q');
        const correctCountEl = document.getElementById('correct-count');
        const wrongCountEl = document.getElementById('wrong-count');
        const resultEl = document.getElementById('result');

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function loadQuestions() {
            const selectedCategory = categorySelect.value;
            if (selectedCategory === 'all') {
                currentQuestions = shuffleArray([...questions]);
            } else {
                currentQuestions = shuffleArray(questions.filter(q => q.category === selectedCategory));
            }
            currentQuestionIndex = 0;
            correctCount = 0;
            wrongCount = 0;
            correctCountEl.textContent = '0';
            wrongCountEl.textContent = '0';
            totalQEl.textContent = currentQuestions.length;
            resultEl.textContent = '';
            nextBtn.style.display = 'inline-block';

            if (currentQuestions.length > 0) {
                loadQuestion();
            } else {
                questionEl.textContent = "Nincs kérdés ebben a témakörben.";
                optionsEl.innerHTML = '';
                imageContainer.innerHTML = '';
                catBadgeEl.textContent = 'Üres';
                currentQEl.textContent = '0';
                nextBtn.disabled = true;
            }
        }

        function loadQuestion() {
            evaluated = false;
            selectedOptions = [];
            nextBtn.textContent = 'Válaszok ellenőrzése';
            nextBtn.disabled = false;
            const currentQ = currentQuestions[currentQuestionIndex];
            currentQEl.textContent = currentQuestionIndex + 1;
            catBadgeEl.textContent = currentQ.category;

            questionEl.textContent = currentQ.q;
            optionsEl.innerHTML = '';
            imageContainer.innerHTML = '';

            if (currentQ.image) {
                const img = document.createElement('img');
                img.src = currentQ.image;
                img.alt = 'Kép: ' + currentQ.image;
                img.onerror = function() {
                    this.style.display = 'none';
                    const placeholder = document.createElement('div');
                    placeholder.className = 'image-placeholder';
                    placeholder.textContent = '⚠️ A kép nem található: ' + currentQ.image;
                    imageContainer.appendChild(placeholder);
                };
                imageContainer.appendChild(img);
            }

            if (currentQ.correct.length > 1) {
                const warn = document.createElement('div');
                warn.className = 'multi-warning';
                warn.textContent = `⚠️ Válasszon ${currentQ.correct.length} helyes választ! (Kattintson a kívánt válaszokra, majd az Ellenőrzés gombra.)`;
                optionsEl.appendChild(warn);
            }

            currentQ.options.forEach((opt, index) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.textContent = opt;
                div.dataset.index = index;
                div.onclick = () => toggleOption(div, index);
                optionsEl.appendChild(div);
            });
        }

        function toggleOption(element, index) {
            if (evaluated) return;
            const idx = selectedOptions.indexOf(index);
            if (idx === -1) {
                selectedOptions.push(index);
                element.classList.add('selected');
            } else {
                selectedOptions.splice(idx, 1);
                element.classList.remove('selected');
            }
        }

        nextBtn.onclick = () => {
            if (!evaluated) {
                evaluated = true;
                const currentQ = currentQuestions[currentQuestionIndex];
                const options = optionsEl.querySelectorAll('.option');
                const correctSorted = [...currentQ.correct].sort((a,b) => a-b);
                const selectedSorted = [...selectedOptions].sort((a,b) => a-b);
                const isCorrect = correctSorted.length === selectedSorted.length &&
                                  correctSorted.every((val, i) => val === selectedSorted[i]);
                if (isCorrect) {
                    correctCount++;
                    correctCountEl.textContent = correctCount;
                } else {
                    wrongCount++;
                    wrongCountEl.textContent = wrongCount;
                }
                options.forEach((opt, idx) => {
                    if (currentQ.correct.includes(idx)) opt.classList.add('correct');
                    else if (selectedOptions.includes(idx)) opt.classList.add('wrong');
                    opt.classList.add('disabled');
                    opt.classList.remove('selected');
                });
                nextBtn.textContent = 'Következő kérdés';
            } else {
                currentQuestionIndex++;
                if (currentQuestionIndex < currentQuestions.length) {
                    loadQuestion();
                } else {
                    questionEl.textContent = "🎉 Gyakorlás befejezve!";
                    optionsEl.innerHTML = '';
                    imageContainer.innerHTML = '';
                    catBadgeEl.textContent = 'Vége';
                    nextBtn.style.display = 'none';
                    resultEl.innerHTML = `Összesen <strong>${currentQuestions.length}</strong> kérdést dolgoztál fel.<br>
                        ✅ Helyes: <strong>${correctCount}</strong> &nbsp;|&nbsp; ❌ Helytelen: <strong>${wrongCount}</strong><br>
                        Eredmény: <strong>${Math.round((correctCount / currentQuestions.length) * 100)}%</strong>`;
                }
            }
        };

        restartBtn.onclick = () => { loadQuestions(); };
        categorySelect.addEventListener('change', loadQuestions);
        loadQuestions();
    </script>
